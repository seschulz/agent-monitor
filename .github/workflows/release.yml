name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release app
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          xcodebuild \
            -project AgentMonitor.xcodeproj \
            -scheme AgentMonitor \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$version" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        id: package
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Agent Monitor.app"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"
          # Ad-hoc distribution has no Developer ID identity, so re-sign the
          # complete bundle after changing its version metadata.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          staging="$RUNNER_TEMP/Agent Monitor"
          mkdir -p "$staging"
          ditto "$app" "$staging/Agent Monitor.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p dist
          image="Agent-Monitor-$version.dmg"
          hdiutil create -volname "Agent Monitor" -srcfolder "$staging" -format UDZO -ov "dist/$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Generate signed Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          sparkle_version="2.9.6"
          sparkle_dir="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle_dir"
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz" \
            -o "$sparkle_dir/sparkle.tar.xz"
          tar -xJf "$sparkle_dir/sparkle.tar.xz" -C "$sparkle_dir"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          for file in *.dmg appcast.xml; do
            if [[ -f "$file" ]]; then
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Monitor-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Agent Monitor $GITHUB_REF_NAME" \
              --generate-notes
          fi
